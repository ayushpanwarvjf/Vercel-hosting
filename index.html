<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Private Proxy API Generator</title>
<style>
  body{font-family:Arial;padding:20px;max-width:720px;margin:auto}
  input{width:100%;padding:8px;margin:6px 0}
  button{padding:8px 12px}
  #result{margin-top:16px}
  .url{word-break:break-all;color:darkgreen}
</style>
</head>
<body>
  <h2>Generate Private API Proxy</h2>
  <p>Enter your API endpoint (include any fixed path & query that should always be used):</p>
  <input id="userApi" placeholder="https://api.example.com/data?key=123" />
  <label><input type="checkbox" id="appendQuery" checked /> Forward additional query params from calls to the new URL</label>
  <br/>
  <button onclick="generate()">Generate private URL</button>

  <div id="result"></div>

<script>
async function generate(){
  const url = document.getElementById('userApi').value.trim();
  if(!url) return alert('Enter your API URL');

  const appendQuery = document.getElementById('appendQuery').checked ? '1':'0';
  try{
    const res = await fetch(`/api/generate?url=${encodeURIComponent(url)}&append=${appendQuery}`);
    const j = await res.json();
    const out = document.getElementById('result');
    if(j.success){
      const full = window.location.origin + j.path;
      out.innerHTML = `<div>✅ Private URL (keep secret):</div><div class="url"><a href="${full}" target="_blank">${full}</a></div>
                       <div style="margin-top:8px;font-size:13px;color:#555">Calls to this URL will proxy to your target without revealing it.</div>`;
    } else {
      out.innerText = 'Error: ' + j.message;
    }
  }catch(e){
    document.getElementById('result').innerText = 'Error: ' + e.message;
  }
}
</script>
</body>
</html>
